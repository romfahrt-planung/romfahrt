<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><script src="firebase-config.js"></script></head><body><title>Romfahrt Belegungsplaner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: one-screen planner — toolbar on top, map (or bus depot) fills the middle, tray of class circles docked at the bottom */
:root{
  --bg:#f3f4f1; --panel:#ffffff; --ink:#1d2321; --muted:#5f6a66; --line:#d9ddd8;
  --accent:#f2c500;            /* campsite-map yellow */
  --girl:#e2367f; --boy:#1f5bc6; --mix:#7a3fb8;
  --six:#00b34a; --five:#e3000f;
  --ok:#0f8a46; --warn:#b4560a;
  --shadow:0 1px 2px rgba(20,30,25,.08),0 4px 14px rgba(20,30,25,.08);
  --f-ui:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-label:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141816; --panel:#1e2421; --ink:#e9ece9; --muted:#9aa5a0; --line:#323a36;
  --accent:#f2c500; --girl:#f0559a; --boy:#4d82e6; --mix:#9a63d6; --ok:#3fbf75; --warn:#e48a3c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141816; --panel:#1e2421; --ink:#e9ece9; --muted:#9aa5a0; --line:#323a36;
  --accent:#f2c500; --girl:#f0559a; --boy:#4d82e6; --mix:#9a63d6; --ok:#3fbf75; --warn:#e48a3c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:10px;gap:10px;box-sizing:border-box}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
h1{font-family:var(--f-label);font-size:22px;letter-spacing:.02em;margin:0;text-transform:uppercase;display:flex;align-items:center;gap:8px}
h1 .tag{background:var(--accent);color:#1d2321;padding:1px 8px;border-radius:3px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:var(--muted);font:600 13px var(--f-ui);padding:6px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.stats{display:flex;flex-wrap:wrap;gap:6px 16px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.stats b{color:var(--ink);font-weight:700}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 13px var(--f-ui);padding:6px 11px;border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.danger{color:var(--five);border-color:color-mix(in srgb,var(--five) 40%,var(--line))}
button:focus-visible{outline:2px solid var(--boy);outline-offset:2px}
.legend{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:9px;border:2px solid;border-radius:2px;vertical-align:-1px;margin-right:4px}
.save{font-size:12px;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.pdfs{display:inline-flex;flex-wrap:wrap;gap:6px}
.pdfb{display:inline-flex;align-items:center;gap:7px}
.pdfi{width:16px;height:19px;flex:none}

main{flex:1;min-height:0;position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.mapwrap{position:absolute;inset:0;overflow:auto;background:#fff;touch-action:pan-x pan-y;cursor:grab;overscroll-behavior:contain}
.mapwrap.panning{cursor:grabbing}
.mapwrap.panning .unit{cursor:grabbing}
.zoomhint{position:absolute;left:10px;bottom:10px;z-index:3;font-size:11px;color:var(--muted);background:color-mix(in srgb,var(--panel) 88%,transparent);padding:3px 8px;border-radius:6px;pointer-events:none}
.zoom .zfit{font-size:16px}
.mapinner{position:relative;width:100%;margin:0 auto}
.mapinner img{display:block;width:100%;height:auto;max-width:none;user-select:none;-webkit-user-drag:none}
.mapinner svg{position:absolute;inset:0;width:100%;height:100%}
.unit{cursor:pointer;stroke-width:1.5;stroke-linejoin:round;fill:transparent;transition:fill .2s}
.unit.c6{stroke:var(--six)} .unit.c5{stroke:var(--five)}
.unit.hot{stroke:#111;stroke-width:2.6;filter:drop-shadow(0 0 3px rgba(255,200,0,.95))}
.unit.full{stroke-width:2}
.unit.occ{stroke:#fff;stroke-width:.5}
.unit.occ.part{stroke-dasharray:1.2 .8}
.labels{pointer-events:none}
.labels text{fill:#fff;text-anchor:middle;font-family:var(--f-label);font-weight:700;paint-order:stroke;stroke:rgba(0,0,0,.25);stroke-width:.25}
.labels .ln{font-weight:600;opacity:.92}
.unit.sel{stroke:#111;stroke-width:3;filter:drop-shadow(0 0 4px rgba(255,200,0,1)) drop-shadow(0 0 2px rgba(255,200,0,1))}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:4px;z-index:3}
.zoom button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:700 18px var(--f-ui);cursor:pointer;box-shadow:var(--shadow)}

.depot{position:absolute;inset:0;overflow:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:10px;align-content:start;background:var(--bg)}
.bus{background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px 10px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .15s}
.bus.hot{border-color:var(--accent);transform:scale(1.03);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 45%,transparent)}
.bus.full{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.bus .top{display:flex;align-items:center;gap:10px}
.bus svg{width:58px;height:30px;flex:none}
.bus .nr{font-family:var(--f-label);font-size:21px;line-height:1}
.bus.med{border-color:#d40000;background:color-mix(in srgb,#d40000 5%,var(--panel))}
.ddtag{display:inline-block;vertical-align:3px;margin-left:4px;font:700 10px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:#1d2321;background:var(--accent);padding:2px 6px;border-radius:3px}
.warn{font-size:12px;font-weight:600;color:#8a4b00;background:#fff1d6;border:1px solid #f0b54a;border-radius:6px;padding:3px 7px}
.bus.warnbus{border-color:#f0b54a}
.warn-s{color:#b4560a}
.warn-s b{color:#b4560a}
.medtag{display:inline-block;vertical-align:3px;margin-left:4px;font:700 10px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:#fff;background:#d40000;padding:2px 6px;border-radius:3px}
.bus .sub{font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:color-mix(in srgb,var(--muted) 20%,transparent);overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.occ{display:flex;flex-wrap:wrap;gap:4px;min-height:18px}
.pill{font:600 11px var(--f-ui);color:#fff;padding:1px 6px;border-radius:999px;font-variant-numeric:tabular-nums}

.selbar{flex:none;min-height:40px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px}
.selbar .hint{color:var(--muted)}
.selbar .selname{font:700 19px var(--f-label);background:var(--accent);color:#1d2321;padding:0 8px;border-radius:4px}
.selbar .sub{color:var(--muted)}
.selbar .occ{display:flex;flex-wrap:wrap;gap:6px}
.grp-pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 3px 2px 9px}
.pbtn{border:0;background:rgba(255,255,255,.28);color:#fff;font:700 13px var(--f-ui);width:22px;height:22px;border-radius:50%;cursor:pointer;line-height:1;padding:0}
.pbtn:hover{background:rgba(255,255,255,.5)}
.selbar .full-tag{font-weight:700;color:var(--ok)}
.tray{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px 10px;overflow-x:auto;overflow-y:hidden;box-shadow:var(--shadow)}
.groups{display:flex;gap:16px;width:max-content}
.grp h3{margin:0 0 4px;font:700 12px var(--f-label);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.grp .rows{display:grid;grid-template-rows:repeat(2,auto);grid-auto-flow:column;gap:6px}
.chip{width:50px;height:50px;border-radius:50%;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;cursor:pointer;user-select:none;transition:opacity .2s,transform .15s;position:relative;border:0;padding:0;font-family:var(--f-ui)}
.chip.m{background:var(--girl)} .chip.j{background:var(--boy)}
.chip .l{font:700 12px var(--f-label);letter-spacing:.02em}
.chip .n{font:700 17px var(--f-ui);font-variant-numeric:tabular-nums;margin-top:2px}
.ro .chip{cursor:default}
.chip.over{box-shadow:0 0 0 3px var(--panel),0 0 0 6px #e3000f}
.chip.done{opacity:.25;cursor:default}
.chip.blocked{opacity:.5;cursor:not-allowed}
.chip.picked{box-shadow:0 0 0 3px var(--panel),0 0 0 6px var(--accent);transform:scale(1.08)}
.chip.ready:hover{transform:scale(1.1);box-shadow:0 0 0 3px var(--panel),0 0 0 6px var(--accent)}
.chip.pop{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.18)}}
.ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;box-shadow:0 8px 22px rgba(0,0,0,.3)}
.ghost .take{position:absolute;top:-10px;right:-14px;background:var(--ink);color:var(--bg);font:700 12px var(--f-ui);padding:2px 6px;border-radius:999px;white-space:nowrap}

.tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:6px;max-width:240px;line-height:1.35;box-shadow:var(--shadow)}
.pop-panel{position:fixed;z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:12px;width:250px;font-size:13px}
.pop-panel h4{margin:0 0 2px;font:700 18px var(--f-label)}
.pop-panel .sub{color:var(--muted);font-size:12px;margin-bottom:8px}
.pop-panel .row{display:flex;align-items:center;gap:6px;padding:4px 0;border-top:1px solid var(--line)}
.pop-panel .row .who{flex:1;display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.pop-panel .row button{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:700 14px var(--f-ui);cursor:pointer}
.pop-panel .row .cnt{width:22px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.pop-panel .empty{color:var(--muted);padding:6px 0;border-top:1px solid var(--line)}
.pop-panel .x{position:absolute;right:8px;top:6px;border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer}
.toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:7px 14px;border-radius:8px;font-size:13px;z-index:70;box-shadow:var(--shadow);pointer-events:none;max-width:calc(100vw - 32px);opacity:.94}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:13px}
@media (max-width:700px){h1{font-size:18px}.legend{display:none}.chip{width:44px;height:44px}.chip .n{font-size:15px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <header>
    <h1><span class="tag">Rom</span> Belegungsplaner</h1>
    <div class="seg" role="group" aria-label="Was verteilen?">
      <button id="m-room" aria-pressed="true">Bungalows</button>
      <button id="m-bus" aria-pressed="false">Busse</button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="spacer"></div>
    <div class="legend" id="legend"><span><i style="border-color:var(--six)"></i>6 Plätze</span><span><i style="border-color:var(--five)"></i>5 Plätze</span></div>
    <span class="save" id="save">Lädt …</span>
  </header>
  <div class="tools">

    <span class="pdfs" id="pdfs-b" hidden><button class="btn pdfb" id="pdf-bus">Busliste <svg class="pdfi" viewBox="0 0 20 24" aria-hidden="true"><path d="M3 1h10l5 5v16a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1z" fill="#fff" stroke="#c4161c" stroke-width="1.5"/><path d="M13 1v5h5" fill="none" stroke="#c4161c" stroke-width="1.5"/><rect x="0" y="12" width="16" height="8" rx="1.5" fill="#c4161c"/><text x="8" y="18.3" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="6.2" font-weight="700" fill="#fff">PDF</text></svg></button></span>
    <button class="btn pdfb" id="xlsx">Excel-Liste <svg class="pdfi" viewBox="0 0 20 24" aria-hidden="true"><path d="M3 1h10l5 5v16a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1z" fill="#fff" stroke="#1d6f42" stroke-width="1.5"/><path d="M13 1v5h5" fill="none" stroke="#1d6f42" stroke-width="1.5"/><rect x="0" y="12" width="16" height="8" rx="1.5" fill="#1d6f42"/><text x="8" y="18.3" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="6.2" font-weight="700" fill="#fff">XLS</text></svg></button>
    <button class="btn" id="st-save" hidden>Stand speichern</button>
    <button class="btn" id="st-load" hidden>Stand laden</button>
    <input type="file" id="st-file" accept=".json,application/json" hidden>
    <span id="loadbox" hidden></span>
    <span id="resetbox"><button class="btn danger" id="reset">Zurücksetzen</button></span>
  </div>

  const l1=Math.hypot(...e1),l2=Math.hypot(...e2);
  const long=l1>=l2?e1:e2;let ang=Math.atan2(long[1],long[0])*180/Math.PI;

function drawLabels(){

    gEl.setAttribute("transform",`translate(${g0.cx.toFixed(2)} ${g0.cy.toFixed(2)})`);
    const flat=Math.abs(g0.ang)<45,tilt=Math.min(Math.abs(g0.ang)%90,90-Math.abs(g0.ang)%90);
    const W=(flat?g0.L:g0.S)*(tilt>4?0.72:1),H=flat?g0.S:g0.L;
    const fit=(txt,max)=>Math.min(max,W*0.82/(Math.max(txt.length,1)*0.62));

/* ---------- render ---------- */
function render(){
  // chips
  GROUPS.forEach(g=>{
    const r=remaining(mode,g.id),el=chipEls[g.id];
    el.querySelector(".n").textContent=r;
    el.classList.toggle("done",r===0);
    el.classList.toggle("over",r<0); // more placed than the class has (e.g. after a correction)
    const blocked=!!(sel&&sel.kind==="u"&&r>0&&(()=>{const sx=sexesIn("u",sel.id);return (sx.size&&!sx.has(g.sex))||teacherClash(sel.id,g.id)})());
    el.classList.toggle("blocked",blocked);
    el.classList.toggle("ready",!!sel&&r>0&&!blocked&&!readOnly);
    el.classList.toggle("picked",picked===g.id);
    el.title=`${gName(g)}: ${r} von ${g.total} noch ${mode==="u"?"ohne Bungalow":"ohne Busplatz"}`;
    el.disabled=false;
  });
  // units
  for(const id in polyEls){
    const n=used("u",id),c=UNITS[id].c,sx=[...sexesIn("u",id)];
    const p=polyEls[id];
    if(n===0){p.style.fill="transparent"}
    else{const rgb=sx.length>1?"122,63,184":(sx[0]==="m"?"226,54,127":"31,91,198");p.style.fill=`rgba(${rgb},${n>=c?1:.82})`}
    p.classList.toggle("occ",n>0);
    p.classList.toggle("full",n>=c);
    p.classList.toggle("sel",!!sel&&sel.kind==="u"&&sel.id===id);
  }
  drawLabels();
  // buses
  for(const id in busEls){
    const b=BUSES[id],occ=state.b[id]||{},n=used("b",id);
    const el=busEls[id];el.classList.toggle("med",b.note==="Krankenbus");el.classList.toggle("full",n>=b.seats);el.classList.toggle("hot",!!sel&&sel.kind==="b"&&sel.id===id);
    const segs=Object.entries(occ).map(([g,k])=>`<span style="width:${k/b.seats*100}%;background:${colorOf(G[g].sex)}"></span>`).join("");
    const pills=Object.entries(occ).map(([g,k])=>`<span class="pill" style="background:${colorOf(G[g].sex)}">${G[g].label} ${k}</span>`).join("");
    el.innerHTML=`<div class="top">${b.note==="Krankenbus"?medIcon:b.seats>60?ddIcon:busIcon}<div><div class="nr">Bus ${id}${b.note==="Krankenbus"?' <span class="medtag">Krankenbus</span>':b.seats>60?' <span class="ddtag">Doppeldecker</span>':""}</div><div class="sub">${b.note&&b.note!=="Krankenbus"?b.note+" · ":""}${b.seats} Plätze · <b>${b.seats-n}</b> frei</div></div></div><div class="bar">${segs}</div>${busWarn(id)?`<div class="warn">⚠ ${warnText(id)} – mindestens 2 nötig</div>`:""}<div class="occ">${pills}</div>`;
    el.classList.toggle("warnbus",busWarn(id));
  }
  // stats
  if(mode==="u"){
    const people=GROUPS.reduce((a,g)=>a+placed("u",g.id),0);
    const usedUnits=Object.keys(state.u).filter(k=>used("u",k)>0).length;
    $("stats").innerHTML=`<span>Untergebracht <b>${people}</b> / ${TOTAL}</span><span>Bungalows belegt <b>${usedUnits}</b> / ${D.units.length}</span><span>Betten frei <b>${BEDS-people}</b></span>`;
  }else{
    const people=GROUPS.reduce((a,g)=>a+placed("b",g.id),0);
    const nw=Object.keys(BUSES).filter(busWarn).length;
    $("stats").innerHTML=`<span>Im Bus <b>${people}</b> / ${TOTAL}</span><span>Plätze frei <b>${SEATS-people}</b> von ${SEATS}</span>${nw?`<span class="warn-s">⚠ <b>${nw}</b> ${nw===1?"Bus":"Busse"} mit weniger als 2 Lehrkräften</span>`:""}`;
  }
  drawBar();
}

/* ---------- assigning ---------- */
function assign(kind,id,gid,want){
  const free=cap(kind,id)-used(kind,id),r=remaining(kind,gid);
  if(free<=0){toast(kind==="u"?`Bungalow ${id} ist voll.`:`Bus ${id} ist voll.`);return 0}
  if(r<=0)return 0;
  if(kind==="u"){
    const sx=sexesIn("u",id);
    if(sx.size&&!sx.has(G[gid].sex)){toast(`Bungalow ${id} ist schon mit ${sexName([...sx][0])} belegt.`);return 0}
    if(teacherClash(id,gid)){toast(G[gid].cls==="Lehrkräfte"?`In Bungalow ${id} wohnen Schüler – Lehrkräfte bitte in einen eigenen Bungalow.`:`Bungalow ${id} ist ein Lehrerbungalow – Schüler bitte woanders unterbringen.`);return 0}
  }
  const k=Math.min(free,r,want??Infinity);
  state[kind][id]??={};
  state[kind][id][gid]=(state[kind][id][gid]||0)+k;
  changed();return k;
}
function adjust(kind,id,gid,d){
  const o=state[kind][id]||{};
  if(d>0){assign(kind,id,gid,1);return}
  o[gid]=(o[gid]||0)+d;
  if(o[gid]<=0)delete o[gid];
  if(!Object.keys(o).length)delete state[kind][id];
  changed();
}
function removeAll(kind,id,gid){const o=state[kind][id];if(!o)return;delete o[gid];if(!Object.keys(o).length)delete state[kind][id];changed()}

/* ---------- selection: first a bungalow / bus, then a circle ---------- */
let sel=null;            // {kind,id}
let confirmClear=false;
let picked=null; // circle clicked before a bungalow
function select(kind,id){
  if(picked){const g=picked;picked=null;sel={kind,id};confirmClear=false;render();onChip(g);return}
  if(sel&&sel.kind===kind&&sel.id===id){sel=null}else{sel={kind,id}}
  confirmClear=false;render();
}
function onChip(gid){
  const c=chipEls[gid];
  if(readOnly){toast("Nur zum Ansehen. Zum Verteilen bitte bei Claude anmelden.");return}
  if(!sel){if(remaining(mode,gid)<=0){toast(gName(G[gid])+" sind schon alle verteilt.");return}picked=picked===gid?null:gid;render();if(picked)toast(gName(G[gid])+" ausgewählt – jetzt "+(mode==="u"?"den Bungalow":"den Bus")+" anklicken.");return}
  if(remaining(sel.kind,gid)<=0){toast(gName(G[gid])+" sind schon alle verteilt.");return}
  const k=assign(sel.kind,sel.id,gid,G[gid].cls==="Lehrkräfte"?1:undefined); // teachers: one per click
  if(k>0){c.classList.remove("pop");void c.offsetWidth;c.classList.add("pop");setTimeout(()=>c.classList.remove("pop"),400);
    toast(`${k} × ${gName(G[gid])} → ${sel.kind==="u"?"Bungalow":"Bus"} ${sel.id}`)}
}
$("groups").addEventListener("click",e=>{const c=e.target.closest(".chip");if(c)onChip(c.dataset.gid)});
svg.addEventListener("click",e=>{const p=e.target.closest("[data-unit]");if(p)select("u",p.dataset.unit)});
$("depot").addEventListener("click",e=>{const b=e.target.closest("[data-bus]");if(b)select("b",b.dataset.bus)});
$("depot").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){const b=e.target.closest("[data-bus]");if(b){e.preventDefault();select("b",b.dataset.bus)}}});

/* ---------- selection bar ---------- */
function drawBar(){
  const bar=$("selbar");
  if(!sel||sel.kind!==mode){bar.innerHTML=readOnly?`<span class="hint">Nur Ansicht. Tippe einen ${mode==="u"?"Bungalow":"Bus"} an, um zu sehen, wer dort ist. Zum Verteilen bei Claude anmelden.</span>`:`<span class="hint">${mode==="u"?"Klicke einen umrandeten Bungalow an":"Klicke einen Bus an"} und danach den Kreis der Klasse, die dort hinein soll.</span>`;return}
  const {kind,id}=sel,c=cap(kind,id),n=used(kind,id),occ=state[kind][id]||{};
  const title=kind==="u"?`Bungalow ${id}`:`Bus ${id}`;
  const sub=kind==="u"?`${UNITS[id].t} · ${c} Plätze`:`${BUSES[id].note?BUSES[id].note+" · ":""}${c} Plätze`;
  const pills=Object.entries(occ).map(([g,k])=>`<span class="pill grp-pill" style="background:${colorOf(G[g].sex)}">${gName(G[g])}: ${k}${readOnly?"":`<button class="pbtn" data-dec="${g}" title="Eine Person weniger" aria-label="Eine Person weniger">−</button><button class="pbtn" data-rm="${g}" title="Gruppe herausnehmen" aria-label="${gName(G[g])} herausnehmen">×</button>`}</span>`).join("");
  const free=c-n;
  const status=(free<=0?`<span class="full-tag">voll</span>`:`<span><b>${free}</b> frei${readOnly?"":" – jetzt einen Kreis anklicken"}</span>`)+(kind==="b"&&busWarn(id)?`<span class="warn">⚠ ${warnText(id)}</span>`:"");
  let action="";
  if(n>0&&!readOnly){action=confirmClear
    ?`<span class="confirm">${title} wirklich leeren? <button class="btn danger" id="cl-yes">Ja, leeren</button><button class="btn" id="cl-no">Abbrechen</button></span>`
    :`<button class="btn danger" id="cl">${kind==="u"?"Bungalow":"Bus"} leeren</button>`}
  bar.innerHTML=`<span class="selname">${title}</span><span class="sub">${sub}</span>${status}<span class="occ">${pills}</span><span class="spacer"></span>${action}<button class="btn" id="desel" aria-label="Auswahl aufheben">Fertig</button>`;
}
$("selbar").addEventListener("click",e=>{
  const rm=e.target.closest?.("[data-rm]"),dec=e.target.closest?.("[data-dec]");
  if((rm||dec)&&sel&&!readOnly){const g=(rm||dec).dataset.rm||(rm||dec).dataset.dec,where=(sel.kind==="u"?"Bungalow ":"Bus ")+sel.id;
    if(rm)removeAll(sel.kind,sel.id,g);else adjust(sel.kind,sel.id,g,-1);
    confirmClear=false;render();return}
  const t=e.target.id;
  if(t==="cl"){confirmClear=true;drawBar()}
  else if(t==="cl-no"){confirmClear=false;drawBar()}
  else if(t==="cl-yes"){delete state[sel.kind][sel.id];confirmClear=false;toast((sel.kind==="u"?"Bungalow ":"Bus ")+sel.id+" ist wieder leer.");changed()}
  else if(t==="desel"){sel=null;confirmClear=false;render()}
});

function enc(s){let o="";for(const ch of String(s)){const c=ch.codePointAt(0);o+=String.fromCharCode(c<256?c:(CP[c]||63))}return o}
function tw(s,size,bold){const t=HW[bold?"Helvetica-Bold":"Helvetica"];let w=0;for(const ch of enc(s)){const c=ch.charCodeAt(0);w+=c>=32?t[c-32]:500}return w*size/1000}
function fit(s,size,bold,max){s=String(s);if(tw(s,size,bold)<=max)return s;while(s.length>1&&tw(s+"…",size,bold)>max)s=s.slice(0,-1);return s+"…"}

class MiniPDF{
  constructor(title){this.W=595.28;this.H=841.89;this.M=48;this.pages=[];this.title=title;this.newPage()}
  newPage(){this.cur=[];this.pages.push(this.cur);this.y=this.M}
  // y measured from top
  text(x,y,s,{size=10,bold=false,color="#1d2321",align="left"}={}){
    let xx=x;if(align!=="left"){const w=tw(s,size,bold);xx=align==="right"?x-w:x-w/2}
    this.cur.push(`BT /${bold?"F2":"F1"} ${size} Tf ${rgb(color)} rg ${xx.toFixed(2)} ${(this.H-y).toFixed(2)} Td (${esc(s)}) Tj ET`)}
  rect(x,y,w,h,color){this.cur.push(`${rgb(color)} rg ${x.toFixed(2)} ${(this.H-y-h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`)}
  line(x1,y1,x2,y2,color="#cfd4cf",lw=.6){this.cur.push(`${rgb(color)} RG ${lw} w ${x1.toFixed(2)} ${(this.H-y1).toFixed(2)} m ${x2.toFixed(2)} ${(this.H-y2).toFixed(2)} l S`)}
  ensure(h,onBreak){if(this.y+h>this.H-this.M){this.newPage();this.header();onBreak&&onBreak()}}
  header(){
    this.text(this.M,this.M+4,this.title,{size:17,bold:true});
    this.text(this.W-this.M,this.M+4,"Romfahrt · Stand "+new Date().toLocaleString("de-DE",{dateStyle:"short",timeStyle:"short"}),{size:8.5,color:"#5f6a66",align:"right"});
    this.rect(this.M,this.M+11,this.W-2*this.M,2,"#f2c500");
    this.y=this.M+32;
  }
  output(){
    const n=this.pages.length;
    this.pages.forEach((p,i)=>p.push(`BT /F1 8 Tf ${rgb("#5f6a66")} rg ${(this.W/2-20).toFixed(2)} 26 Td (${esc(`Seite ${i+1} von ${n}`)}) Tj ET`));
    const objs=[];const add=s=>(objs.push(s),objs.length);
    const cat=add(""),pagesId=add("");
    const f1=add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
    const f2=add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
    const kids=[];
    for(const p of this.pages){const c=p.join("\n");const cs=add(`<< /Length ${c.length} >>\nstream\n${c}\nendstream`);

    objs[cat-1]=`<< /Type /Catalog /Pages ${pagesId} 0 R >>`;
    objs[pagesId-1]=`<< /Type /Pages /Kids [${kids.map(k=>k+" 0 R").join(" ")}] /Count ${kids.length} >>`;
    const info=add(`<< /Title (${esc(this.title)}) /Producer (Romfahrt Belegungsplaner) >>`);
    let out="%PDF-1.4\n%\xE2\xE3\xCF\xD3\n";const offs=[];
    objs.forEach((o,i)=>{offs.push(out.length);out+=`${i+1} 0 obj\n${o}\nendobj\n`});
    const x=out.length;
    out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.map(o=>String(o).padStart(10,"0")+" 00000 n \n").join("");
    out+=`trailer\n<< /Size ${objs.length+1} /Root ${cat} 0 R /Info ${info} 0 R >>\nstartxref\n${x}\n%%EOF`;
    const b=new Uint8Array(out.length);for(let i=0;i<out.length;i++)b[i]=out.charCodeAt(i)&255;return b;
  }
}
/* table: cols [{t,w,a}] widths sum to content width; rows: arrays of strings, or {group:"..."} */
function table(pdf,cols,rows){
  const x0=pdf.M,RH=17,FS=9.5;
  const head=()=>{pdf.rect(x0,pdf.y,pdf.W-2*pdf.M,RH,"#1d2321");let x=x0;
    cols.forEach(c=>{pdf.text(c.a==="r"?x+c.w-6:x+6,pdf.y+11.8,c.t,{size:8.5,bold:true,color:"#ffffff",align:c.a==="r"?"right":"left"});x+=c.w});pdf.y+=RH};
  pdf.ensure(RH*2);head();
  let z=0;
  rows.forEach((r,i)=>{
    if(r.group!==undefined){
      const keep=Math.min(4,rows.slice(i+1).findIndex(q=>q.group!==undefined)>>>0)||1;
      pdf.ensure(RH*(1+Math.min(keep,3)),head);
      pdf.rect(x0,pdf.y,pdf.W-2*pdf.M,RH,r.color||"#fff4c2");
      pdf.text(x0+6,pdf.y+12,r.group,{size:10,bold:true});
      if(r.right)pdf.text(pdf.W-pdf.M-6,pdf.y+12,r.right,{size:8.5,color:"#3b4542",align:"right"});
      pdf.y+=RH;z=0;return}
    pdf.ensure(RH,head);
    if(z++%2)pdf.rect(x0,pdf.y,pdf.W-2*pdf.M,RH,"#f3f4f1");
    let x=x0;
    cols.forEach((c,j)=>{const v=r[j]??"";const s=fit(v,FS,!!r.bold,c.w-12);
      pdf.text(c.a==="r"?x+c.w-6:x+6,pdf.y+12,s,{size:FS,bold:!!r.bold||(c.b&&v!==""),color:r.color||"#1d2321",align:c.a==="r"?"right":"left"});x+=c.w});
    pdf.y+=RH;
  });
  pdf.line(x0,pdf.y,pdf.W-pdf.M,pdf.y,"#9aa5a0");pdf.y+=14;
}

const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRCT[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function zip(files){ // files: [{name, data:string}]
  const te=new TextEncoder(),parts=[],central=[];let off=0;
  for(const f of files){
    const name=te.encode(f.name),data=te.encode(f.data),crc=crc32(data);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);
    h.setUint16(10,0,true);h.setUint16(12,0x21,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);
    h.setUint16(26,name.length,true);h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),name,data);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);
    c.setUint16(12,0,true);c.setUint16(14,0x21,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);
    c.setUint16(28,name.length,true);c.setUint32(42,off,true);
    central.push(new Uint8Array(c.buffer),name);
    off+=30+name.length+data.length;
  }
  const csize=central.reduce((a,p)=>a+p.length,0);
  const e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,csize,true);e.setUint32(16,off,true);
  return new Blob([...parts,...central,new Uint8Array(e.buffer)],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
const xesc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function sheetXml(header,rows,widths){
  const all=[header,...rows];
  const xmlRows=all.map((r,ri)=>`<row r="${ri+1}">`+r.map((v,ci)=>{
    const ref=colL(ci)+(ri+1),st=ri===0?' s="1"':'';
    if(v===null||v===undefined||v==="")return "";
    if(typeof v==="number")return `<c r="${ref}"${st}><v>${v}</v></c>`;
    return `<c r="${ref}" t="inlineStr"${st}><is><t xml:space="preserve">${xesc(v)}</t></is></c>`}).join("")+`</row>`).join("");

  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("")}</cols><sheetData>${xmlRows}</sheetData><autoFilter ref="A1:${last}"/></worksheet>`;

    {name:"xl/workbook.xml",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s,i)=>`<sheet name="${xesc(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")}</sheets><definedNames>${sheets.map((s,i)=>`<definedName name="_xlnm._FilterDatabase" localSheetId="${i}" hidden="1">'${xesc(s.name)}'!$A$1:$${colL(s.header.length-1)}$${s.rows.length+1}</definedName>`).join("")}</definedNames></workbook>`},

    {name:"xl/styles.xml",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FF000000"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFF2C500"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs><cellStyles count="1"><cellStyle name="Standard" xfId="0" builtinId="0"/></cellStyles></styleSheet>`},

async function saveFile(name,blob){
  if(dlCap===undefined){try{dlCap=await window.claude?.use?.("downloads")}catch(e){dlCap=null}}
  if(dlCap){try{await dlCap.save({filename:name,data:blob})}catch(e){if(e?.code!=="declined")toast("Datei konnte nicht gespeichert werden.")}return}
  if(window.claude){toast("Herunterladen ist in dieser Ansicht nicht möglich.");return}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}

/* ---------- persistence ----------
   Online (claude.ai): signed-in people share one live plan in the db.
   People who are not signed in see the snapshot baked into the page; an
   editor's view re-publishes the page with a fresh snapshot after a quiet
